name: appliance
on:
  push:
    branches: [dev]
    paths:
      - "appliance/**"
      - "src/**"
      - "pyproject.toml"
      - "scripts/evaluate_humaneval.py"
      - "tests/test_gpu.py"
      - "tests/test_appliance.py"
      - "tests/test_mixed_quant.py"
      - "tests/test_quant_recovery.py"
      - "tests/test_upstream_reconstruction.py"
      - "tests/test_proof_run.py"
      - "tests/test_wizard.py"
      - ".github/workflows/appliance.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: appliance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install itsdangerous huggingface_hub pytest safetensors fastapi uvicorn jinja2 python-multipart httpx PyYAML "transformers>=5.17.0" "accelerate>=1.10.0"
      - run: python -m pip install --no-deps lion-pytorch==0.2.5
      - name: Fetch pinned quantizer sources
        run: |
          git clone https://github.com/IST-DASLab/GSQ /tmp/gsq
          git -C /tmp/gsq checkout --detach 03fc16484c369e3127225615d5e03e8d3a6043e3
          git clone https://github.com/IntelChina-AI/BitTern /tmp/bittern
          git -C /tmp/bittern checkout --detach 5a8fcd4f7e0366554b732d300a37e6ea467c3c35
      - run: python -m pytest -q tests/test_gpu.py tests/test_appliance.py tests/test_mixed_quant.py tests/test_quant_recovery.py tests/test_upstream_reconstruction.py tests/test_proof_run.py tests/test_wizard.py
        env:
          QWEN12G_TEST_GSQ_ROOT: /tmp/gsq
          QWEN12G_TEST_CATQ_ROOT: /tmp/bittern
  publish:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            dockerfile: appliance/Dockerfile
            channel: latest
            branch-tag: dev
          - backend: rocm
            dockerfile: appliance/Dockerfile.rocm
            channel: latest-rocm
            branch-tag: rocm
    steps:
      - uses: actions/checkout@v7
      # CUDA/ROCm development images exceed the runner's default free space.
      # These directories belong only to this disposable GitHub-hosted runner.
      - name: Make room for GPU runtime images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          docker system prune --all --force
          sudo apt-get clean
          df -h /
      - name: Select registry image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish ${{ matrix.backend }} appliance
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ matrix.channel }}
            ${{ steps.image.outputs.name }}:${{ matrix.branch-tag }}
            ${{ steps.image.outputs.name }}:${{ matrix.backend }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_JOBS=2
          provenance: mode=max
      - name: Record published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ matrix.channel }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "### Published $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
