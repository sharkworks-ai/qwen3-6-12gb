name: appliance
on:
  push:
    branches: [dev]
    paths:
      - "appliance/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/test_appliance.py"
      - ".github/workflows/appliance.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install itsdangerous huggingface_hub pytest
      - run: pytest -q tests/test_appliance.py
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: appliance/Dockerfile
          push: true
          tags: ghcr.io/taylorelley/qwen3.6-12gb:dev
          build-args: |
            GIT_COMMIT=${{ github.sha }}
