name: appliance
on:
  push:
    branches: [dev]
    paths:
      - "appliance/**"
      - "src/**"
      - "pyproject.toml"
      - "tests/test_appliance.py"
      - "tests/test_mixed_quant.py"
      - "tests/test_quant_recovery.py"
      - "tests/test_upstream_reconstruction.py"
      - "tests/test_proof_run.py"
      - ".github/workflows/appliance.yml"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install itsdangerous huggingface_hub pytest safetensors fastapi uvicorn jinja2 python-multipart httpx PyYAML "transformers>=5.17.0" "accelerate>=1.10.0"
      - run: python -m pip install --no-deps lion-pytorch==0.2.5
      - name: Fetch pinned quantizer sources
        run: |
          git clone https://github.com/IST-DASLab/GSQ /tmp/gsq
          git -C /tmp/gsq checkout --detach 03fc16484c369e3127225615d5e03e8d3a6043e3
          git clone https://github.com/IntelChina-AI/BitTern /tmp/bittern
          git -C /tmp/bittern checkout --detach 5a8fcd4f7e0366554b732d300a37e6ea467c3c35
      - run: python -m pytest -q tests/test_appliance.py tests/test_mixed_quant.py tests/test_quant_recovery.py tests/test_upstream_reconstruction.py tests/test_proof_run.py
        env:
          QWEN12G_TEST_GSQ_ROOT: /tmp/gsq
          QWEN12G_TEST_CATQ_ROOT: /tmp/bittern
  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: appliance/Dockerfile
          push: true
          tags: ghcr.io/taylorelley/qwen3.6-12gb:dev
          build-args: |
            GIT_COMMIT=${{ github.sha }}
