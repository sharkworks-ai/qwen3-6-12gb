<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or "Qwen3.6 12GB Lab" }}</title><style>:root{color-scheme:dark;--bg:#090d13;--p:#111824;--m:#8e9aab;--l:#263246;--f:#edf3f8;--a:#7dd3fc;--g:#86efac;--b:#fca5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--f);font:14px/1.5 system-ui,sans-serif}header{position:sticky;top:0;background:#090d13ee;border-bottom:1px solid var(--l);padding:14px 24px;display:flex;gap:20px;align-items:center}header strong{font-size:16px}a{color:var(--a);text-decoration:none}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:18px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--l);text-align:left}input,select,button{background:#0d1420;color:var(--f);border:1px solid var(--l);border-radius:8px;padding:9px 11px}input{max-width:100%}button{cursor:pointer}.primary{border-color:#38bdf8}.muted{color:var(--m)}.good{color:var(--g)}.bad{color:var(--b)}pre{white-space:pre-wrap;background:#070a0f;padding:14px;border-radius:8px;overflow:auto}.status{display:inline-block;padding:2px 8px;border:1px solid var(--l);border-radius:20px}</style></head><body><header><strong>Qwen3.6 12GB Lab</strong><a href="/">Dashboard</a><a href="/workflows">Workflows</a><a href="/compression">B / C compression</a><a href="/workbench">Workbench</a><a href="/runs">Runs</a><a href="/publish">Publish</a><a href="/system">System</a><form method="post" action="/logout" style="margin-left:auto"><button>Log out</button></form></header><main>{% block content %}{% endblock %}</main></body></html>
