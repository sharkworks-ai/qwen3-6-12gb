<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or "Qwen3.6 12GB Lab" }}</title><style>:root{color-scheme:dark;--bg:#090d13;--p:#111824;--m:#8e9aab;--l:#263246;--f:#edf3f8;--a:#7dd3fc;--g:#86efac;--b:#fca5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--f);font:14px/1.5 system-ui,sans-serif}header{position:sticky;top:0;background:#090d13ee;border-bottom:1px solid var(--l);padding:14px 24px;display:flex;gap:20px;align-items:center}header{flex-wrap:wrap}textarea{font:12px/1.45 ui-monospace,monospace;resize:vertical}header strong{font-size:16px}a{color:var(--a);text-decoration:none}main{max-width:1200px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{background:var(--p);border:1px solid var(--l);border-radius:12px;padding:18px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid var(--l);text-align:left}input,select,textarea,button{background:#0d1420;color:var(--f);border:1px solid var(--l);border-radius:8px;padding:9px 11px}input{max-width:100%}button{cursor:pointer}.primary{border-color:#38bdf8}.muted{color:var(--m)}.good{color:var(--g)}.bad{color:var(--b)}dt{font-weight:600;margin-top:12px}dd{margin:4px 0 12px;color:var(--m)}details{margin:12px 0}summary{cursor:pointer;color:var(--a)}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#070a0f;padding:14px;border-radius:8px;overflow:auto}.status{display:inline-block;padding:2px 8px;border:1px solid var(--l);border-radius:20px}</style></head><body><header><strong>Qwen3.6 12GB Lab</strong><a href="/wizard">New run</a><a href="/dashboard">Dashboard</a><a href="/workflows">Advanced stages</a><a href="/compression">Compression</a><a href="/proof">Reports & tests</a><a href="/workbench">Research tools</a><a href="/runs">Runs</a><a href="/publish">Publish</a><a href="/system">System</a><a href="/help">Help</a><form method="post" action="/logout" style="margin-left:auto"><button>Log out</button></form></header><main>{% block content %}{% endblock %}</main><script>
const fieldGuide={{ field_help | tojson }};
document.querySelectorAll('textarea[name="config_json"]').forEach((area,index)=>{
if(!area.id)area.id='stage-config-'+index;
if(!area.labels.length){const label=document.createElement('label');label.htmlFor=area.id;label.textContent='Advanced JSON configuration';area.before(label);}
const details=document.createElement('details'),summary=document.createElement('summary'),list=document.createElement('dl');summary.textContent='Configuration field guide';details.append(summary,list);area.after(details);
function explain(){list.replaceChildren();try{const config=JSON.parse(area.value);function visit(object,prefix=''){if(!object||typeof object!=='object')return;for(const [key,value]of Object.entries(object)){if(/^\d+$/.test(key)){visit(value,prefix);continue;}const title=document.createElement('dt'),body=document.createElement('dd');title.textContent=prefix+key;body.textContent=fieldGuide[key]||'Stage-specific setting. See Help and the saved configuration for this backend.';list.append(title,body);if(value&&typeof value==='object')visit(value,prefix+key+'.');}}visit(config);}catch(e){const p=document.createElement('p');p.textContent='Enter valid JSON to see the field guide.';list.append(p);}}
area.addEventListener('input',explain);area.closest('section')?.querySelectorAll('select,input[type="checkbox"]').forEach(control=>control.addEventListener('change',()=>setTimeout(explain,0)));explain();
});
</script></body></html>
