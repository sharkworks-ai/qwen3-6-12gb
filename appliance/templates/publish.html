{% extends "base.html" %}{% block content %}<h1>Publish</h1><div class="grid"><section class="card"><h2>GitHub</h2><p class="{{'good' if github_ready else 'bad'}}">{{'GITHUB_TOKEN configured' if github_ready else 'GITHUB_TOKEN not configured'}}</p><form method="post" action="/publish/github"><p><label>Source path<br><input name="source_path" value="/data/artifacts"></label></p><p><label>Repository URL<br><input name="repo_url" placeholder="https://github.com/owner/repo.git" required></label></p><p><label>Branch<br><input name="branch" value="main"></label></p><p><label>Commit message<br><input name="message" value="Publish model artifacts"></label></p><button class="primary">Push to GitHub</button></form></section><section class="card"><h2>Hugging Face</h2><p class="{{'good' if hf_ready else 'bad'}}">{{'HF_TOKEN configured' if hf_ready else 'HF_TOKEN not configured'}}</p><form method="post" action="/publish/hf"><p><label>Source path<br><input name="source_path" value="/data/artifacts"></label></p><p><label>Repo ID<br><input name="repo_id" placeholder="owner/model" required></label></p><p><label>Type <select name="repo_type"><option value="model">model</option><option value="dataset">dataset</option></select></label></p><p><label><input type="checkbox" name="private" checked> Private repository</label></p><button class="primary">Upload to Hugging Face</button></form></section></div>{% if message %}<h2>Result</h2><pre>{{message}}</pre>{% endif %}{% endblock %}
