{% extends "base.html" %}{% block content %}<h1>Runs</h1><table><tr><th>Run</th><th>Kind</th><th>Status</th><th>PID</th><th>Exit</th><th>Created</th></tr>{% for j in jobs %}<tr><td><a href="/runs/{{j.run_id}}">{{j.run_id}}</a></td><td>{{j.kind}}</td><td>{{j.status}}</td><td>{{j.pid or ""}}</td><td>{{j.exit_code if j.exit_code is not none else ""}}</td><td>{{j.created_at}}</td></tr>{% endfor %}</table>{% endblock %}
