{% extends "base.html" %}{% block content %}<h1>{{job.run_id}}</h1><p>{{job.kind}} · <strong>{{job.status}}</strong> · PID {{job.pid}}</p>{% if job.status in ["running","stopping"] %}<form method="post" action="/runs/{{job.run_id}}/stop"><button>Stop job</button></form>{% endif %}<h2>Config</h2><pre>{{config}}</pre><h2>Result</h2><pre>{{result}}</pre><h2>stdout</h2><pre>{{stdout}}</pre><h2>stderr</h2><pre>{{stderr}}</pre>{% endblock %}
