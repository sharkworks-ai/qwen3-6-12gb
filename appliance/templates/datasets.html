{% extends "base.html" %}{% block content %}
<h1>Dataset manager</h1><p class="muted">Freeze provenance/license manifests for training mixtures. JSON fields are explicit so records remain reproducible.</p>
<form method="post" action="/datasets/manifest">
<p><label>Name<br><input name="name" required></label></p>
<p><label>Files JSON<br><input name="files_json" value="[]"></label></p>
<p><label>Sources JSON<br><input name="sources_json" value="[]"></label></p>
<p><label>Licenses JSON<br><input name="licenses_json" value="[]"></label></p>
<button class="primary">Create manifest</button></form>
{% if message %}<pre>{{message}}</pre>{% endif %}
{% endblock %}
