services:
  qwen12g:
    build:
      context: ..
      dockerfile: appliance/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        LLAMA_CUDA_ARCHITECTURES: ${QWEN12G_CUDA_ARCHITECTURES:-75;86;89;120}
        BUILD_JOBS: ${QWEN12G_BUILD_JOBS:-2}
    image: qwen12g-appliance:dev
    container_name: qwen12g
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: "32gb"
    ports:
      - "${QWEN12G_PORT:-8080}:8080"
    environment:
      QWEN12G_WEB_TOKEN: ${QWEN12G_WEB_TOKEN:?set QWEN12G_WEB_TOKEN}
      QWEN12G_DATA_ROOT: /data
      QWEN12G_SECURE_COOKIE: ${QWEN12G_SECURE_COOKIE:-0}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /data/hf-cache
    volumes:
      - qwen12g-data:/data
volumes:
  qwen12g-data:

